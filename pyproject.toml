[project]
name = "photonic-forecasting"
version = "0.1.0"
description = "Production-grade PV production forecasting for renewable energy communities"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "numpy>=2.0",
    "pvlib>=0.11",
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "pandera>=0.20",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
	"ruff>0.6",
	"mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pre-commit>=3.8",
    "pandas-stubs",
    "types-requests",
]

notebooks = ["jupyterlab", "matplotlib", "seaborn", "ydata-profiling"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pv"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort import ordering
    "N",         # pep8-naming
    "UP",        # pyupgrade modern syntax
    "B",         # bugbear
    "A",         # builtin shadowing
    "C4",        # comprehensions
    "PTH",       # use pathlib, not os.path
    "SIM",       # simplification
    "RUF",       # ruff-specific
]

ignore = ["E501"]  # formatter handles line length

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pvlib.*", "lightgbm.*", "duckdb.*", "pandera.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=pv --cov-report=term-missing"
markers = [
    "integration: hits external services or requires data (deselect with '-m \"not integration\"')",
]
